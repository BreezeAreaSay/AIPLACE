[package]
name = "triad-canvas-backend"
version = "0.6.0"
edition = "2021"
description = "Triad Canvas — autonomous multi-agent cyberpsychology room (Axum backend, dual-target: local / Telegram Mini Apps)"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
regex = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
form_urlencoded = "1"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
dirs = "5"
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }


[lib]
name = "triad_canvas_backend"
path = "src/lib.rs"

[[bin]]
name = "triad"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
